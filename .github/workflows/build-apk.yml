name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # This project has no dedicated release signing config (Flutter's
      # own template leaves that as a TODO in build.gradle.kts), so
      # `flutter build apk --release` below signs with the debug
      # keystore. That keystore doesn't exist on a fresh runner, so
      # without caching it Gradle would silently generate a brand new
      # one on every single build - fine for local dev, but it means the
      # APK's SHA-1 fingerprint (what Google Cloud Console restricts a
      # Maps/Places/Sign-In API key to) would change on every rebuild,
      # breaking that restriction each time. Caching keeps the same
      # keystore (and SHA-1) forever after the first run.
      - name: Cache/restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Package name + SHA-1 are what Google Cloud Console needs to
      # restrict an Android API key (Maps SDK, Places, etc.) to this
      # app. Package name is always com.foodexpress.customer_app (set
      # by "Ensure Android platform files exist" below); grab the SHA-1
      # from this step's log output (look for the "SHA1:" line).
      - name: Print SHA-1 fingerprint (for Google Cloud Console API key restrictions)
        run: |
          echo "Package name: com.foodexpress.customer_app"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter packages
        run: flutter pub get

      # `flutter pub get` normally triggers this automatically (since
      # pubspec.yaml has flutter: generate: true), but running it
      # explicitly here means a build fails loudly on a broken ARB file
      # instead of silently shipping an app that can't find
      # AppLocalizations at compile time.
      - name: Generate localizations (lib/l10n/app_localizations.dart)
        run: flutter gen-l10n

      # Generates/updates the android/ platform folder to match the
      # Flutter SDK version on this runner. Safe to run on an existing
      # project: it does not overwrite lib/ or pubspec.yaml.
      - name: Ensure Android platform files exist
        run: flutter create --platforms=android --org com.foodexpress --project-name customer_app .

      # The display name shown under the icon on the phone's home
      # screen / app drawer — separate from `customer_app` above, which
      # is just the internal Flutter/Gradle project identifier (used in
      # Dart import paths throughout lib/, not shown to users, and not
      # worth renaming). `flutter create` sets android:label to that
      # internal project name by default, so it has to be overwritten
      # here every build, same as every other manifest edit below.
      - name: Set app display name
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="JEEVI FOODIE"/' "$MANIFEST"

      # Generates android/app/src/main/res/mipmap-*/ic_launcher.png (and the
      # iOS AppIcon set) from assets/icon/icon.png + icon_foreground.png.
      # Must run after "Ensure Android platform files exist" above, since
      # that's what creates the android/ folder these icons get written
      # into - and since that folder isn't committed to the repo, this has
      # to be regenerated on every CI run rather than done once locally.
      - name: Generate app icons
        run: dart run flutter_launcher_icons

      # flutter_local_notifications' AndroidInitializationSettings was
      # pointing at '@mipmap/ic_launcher' for the status-bar/notification
      # small icon. Android renders that icon using ONLY its alpha
      # channel (silhouette), stripping all color - our full-color
      # launcher icon has no transparency, so instead of a garbled
      # result Android falls back to a generic "first letter of the app
      # name in a circle" badge. Fix: ship a dedicated white-silhouette
      # icon at each density (assets/icon/notification/, committed to
      # the repo) and copy it into the res/drawable-*dpi/ folders that
      # `flutter create` just generated (not committed, so this has to
      # run every build, same reasoning as the app icon step above).
      - name: Install notification status-bar icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/drawable-$density"
            cp "assets/icon/notification/ic_stat_notify_$density.png" \
               "android/app/src/main/res/drawable-$density/ic_stat_notify.png"
          done

      # `flutter create` only adds INTERNET permission to the *debug*
      # manifest by default. Without it in the main manifest, release
      # APKs get no network access at all (shows up as a DNS/host-lookup
      # error even though the domain is fine) - so we add it here.
      # POST_NOTIFICATIONS is also required (Android 13+) for push
      # notifications to actually display.
      - name: Ensure required permissions in release manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />#' "$MANIFEST"
          fi
          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$MANIFEST"
          fi
          # geolocator's own AndroidManifest merges these in automatically
          # at build time regardless, but declaring them explicitly here
          # matches how every other permission in this project is handled,
          # and makes the requirement obvious from reading this file alone.
          if ! grep -q "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' "$MANIFEST"
          fi
          # image_picker's camera-capture option needs this (its own
          # manifest merges it in regardless, same reasoning as above).
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.CAMERA" />#' "$MANIFEST"
          fi
          # Background/terminated-app pushes are shown directly by the FCM
          # SDK (not by our own Dart code), so it needs to be told about
          # the same status-bar icon via this meta-data tag - otherwise
          # those notifications fall back to the generic letter badge even
          # though foreground notifications (shown via our own
          # flutter_local_notifications call) use the right icon.
          if ! grep -q "com.google.firebase.messaging.default_notification_icon" "$MANIFEST"; then
            sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notify" />\n</application>#' "$MANIFEST"
          fi
          cat "$MANIFEST"

      # google_maps_flutter (location_picker_screen.dart, add_address_screen.dart,
      # order_track_screen.dart) needs a Maps SDK for Android key here, or the
      # map renders as a blank grey tile with a "For development purposes
      # only" watermark. Get one from Google Cloud Console -> APIs & Services
      # -> Credentials -> Create API key, then restrict it to Android apps
      # using this run's package name + SHA-1 (see "Print SHA-1 fingerprint"
      # step above for both).
      #
      # Setup (one-time): Repo -> Settings -> Secrets and variables ->
      # Actions -> New repository secret -> name it GOOGLE_MAPS_API_KEY,
      # paste the key as the value.
      - name: Set Google Maps API key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY secret not set - maps will render blank/watermarked until it's added. See build-apk.yml comments for setup steps."
            exit 0
          fi
          if ! grep -q "com.google.android.geo.API_KEY" "$MANIFEST"; then
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.geo.API_KEY\" android:value=\"$GOOGLE_MAPS_API_KEY\" />\n</application>#" "$MANIFEST"
          fi

      # file_picker pulls in flutter_plugin_android_lifecycle, which now
      # requires apps to compile against Android API 36 or later. The
      # compileSdk value Flutter's own template writes into the freshly
      # generated build.gradle.kts (flutter.compileSdkVersion) still
      # tracks an older API level, so the release build fails at
      # :file_picker:checkReleaseAarMetadata with:
      #   "Dependency ':flutter_plugin_android_lifecycle' requires
      #    libraries and applications that depend on it to compile
      #    against version 36 or later of the Android APIs."
      # Since android/app/build.gradle.kts isn't committed to the repo
      # (it's regenerated every run), pin compileSdk to 36 here so it
      # sticks.
      - name: Bump compileSdk to 36 (required by flutter_plugin_android_lifecycle)
        run: |
          APP_GRADLE=android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$APP_GRADLE"
          grep -n "compileSdk" "$APP_GRADLE"

      # flutter_local_notifications (used for displaying push notifications)
      # requires Android core library desugaring to be enabled, or the
      # release build fails at :app:checkReleaseAarMetadata with:
      #   "Dependency ':flutter_local_notifications' requires core library
      #    desugaring to be enabled for :app."
      # Since android/app/build.gradle.kts is regenerated fresh every run
      # by `flutter create` above (it isn't committed to the repo), this
      # setting never sticks unless we patch it back in here each time.
      - name: Enable core library desugaring (required by flutter_local_notifications)
        run: |
          APP_GRADLE=android/app/build.gradle.kts

          if ! grep -q "isCoreLibraryDesugaringEnabled" "$APP_GRADLE"; then
            sed -i '0,/compileOptions {/s//compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$APP_GRADLE"
          fi

          if ! grep -q "coreLibraryDesugaring(" "$APP_GRADLE"; then
            if grep -q "^dependencies {" "$APP_GRADLE"; then
              sed -i '0,/^dependencies {/s//dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")/' "$APP_GRADLE"
            else
              printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$APP_GRADLE"
            fi
          fi

          cat "$APP_GRADLE"

      # Firebase push notifications need google-services.json (from
      # Firebase Console -> Project Settings -> your Android app) and the
      # Google Services Gradle plugin applied. The json is decoded from a
      # repo secret so it's never committed to the repository.
      #
      # Setup (one-time):
      #   1. Firebase Console -> Add Android app -> package name
      #      com.foodexpress.customer_app -> download google-services.json
      #   2. base64 -w0 google-services.json   (macOS: base64 -i google-services.json)
      #   3. Repo -> Settings -> Secrets and variables -> Actions ->
      #      New repository secret -> name it GOOGLE_SERVICES_JSON_BASE64,
      #      paste the base64 output as the value
      - name: Set up Firebase (google-services.json + Gradle plugin, if configured)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set - building without Firebase. See build-apk.yml comments for setup steps."
            exit 0
          fi

          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

          # Recent Flutter templates declare top-level plugin versions in
          # settings.gradle.kts; older ones use android/build.gradle.kts.
          # Try settings.gradle.kts first and fall back, so this keeps
          # working whichever template the CI's Flutter version ships.
          ROOT_FILE=android/settings.gradle.kts
          if ! grep -q "plugins {" "$ROOT_FILE" 2>/dev/null; then
            ROOT_FILE=android/build.gradle.kts
          fi
          APP_GRADLE=android/app/build.gradle.kts

          if ! grep -q "com.google.gms.google-services" "$ROOT_FILE"; then
            sed -i '0,/plugins {/s//plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false/' "$ROOT_FILE"
          fi
          if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
            sed -i '0,/plugins {/s//plugins {\n    id("com.google.gms.google-services")/' "$APP_GRADLE"
          fi

          echo "--- $ROOT_FILE ---"; cat "$ROOT_FILE"
          echo "--- $APP_GRADLE ---"; cat "$APP_GRADLE"

      # Caches Gradle/Kotlin artifacts across runs so we hit Maven
      # Central far less often (helps avoid transient 429 rate-limit
      # errors from repo.maven.apache.org).
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Maven Central occasionally returns 429 (Too Many Requests) to CI
      # runners. Retry a few times with a short backoff instead of
      # failing the whole workflow on a transient network error.
      - name: Build release APK (with retry)
        run: |
          for attempt in 1 2 3 4; do
            echo "Build attempt $attempt..."
            if flutter build apk --release; then
              echo "Build succeeded."
              exit 0
            fi
            echo "Build failed, waiting before retry..."
            sleep $((attempt * 30))
          done
          echo "All attempts failed."
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
